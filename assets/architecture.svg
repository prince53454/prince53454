<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title"><title id="title">Architecture: Volta transaction flow, adaptive retrieval workflow, and MRI classification pipeline</title><style>
.flow{stroke-dasharray:7 9;animation:flow 2.5s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-in-out infinite}
.scan{animation:scan 4.5s ease-in-out infinite}
.transfer{animation:transfer 4s ease-in-out infinite}
.route{animation:route 5s linear infinite}
.ray-top{animation:ray-top 4s linear infinite}
.ray-bottom{animation:ray-bottom 4s linear infinite}
.ray-mid{animation:ray-mid 4s linear infinite}
.reveal{transform-box:fill-box;transform-origin:left;animation:reveal 5s ease-in-out infinite}
.cursor{animation:cursor 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-64}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(63px);opacity:.85}}
@keyframes transfer{0%,15%{transform:translateX(0);opacity:0}25%{opacity:1}70%{transform:translateX(179px);opacity:1}85%,100%{transform:translateX(179px);opacity:0}}
@keyframes route{0%{transform:translate(55px,102px);opacity:0}5%{opacity:1}32%{transform:translate(185px,76px)}64%{transform:translate(325px,102px)}92%{opacity:1}100%{transform:translate(492px,102px);opacity:0}}
@keyframes ray-top{0%{transform:translate(30px,70px);opacity:0}8%{opacity:1}56%{transform:translate(300px,70px)}95%{opacity:1}100%{transform:translate(510px,127px);opacity:0}}
@keyframes ray-bottom{0%{transform:translate(30px,128px);opacity:0}8%{opacity:1}56%{transform:translate(300px,128px)}95%{opacity:1}100%{transform:translate(510px,71px);opacity:0}}
@keyframes ray-mid{0%{transform:translate(30px,99px);opacity:0}8%,95%{opacity:1}100%{transform:translate(510px,99px);opacity:0}}
@keyframes reveal{0%,100%{transform:scaleX(.55);opacity:.4}50%{transform:scaleX(1);opacity:.85}}
@keyframes cursor{0%,15%,100%{transform:translate(0,0)}50%,75%{transform:translate(280px,12px)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.scan,.transfer,.route,.ray-top,.ray-bottom,.ray-mid,.reveal,.cursor{animation:none!important}.route,.ray-top,.ray-bottom,.ray-mid,.transfer{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035" /></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06130b" /><stop offset="1" stop-color="#020805" /></linearGradient></defs><rect width="1200" height="330" rx="20" fill="url(#bg)" /><rect width="1200" height="330" rx="20" fill="url(#grid)" /><rect x="1" y="1" width="1198" height="328" rx="19" fill="none" stroke="#235a37" /><g font-family="Arial, sans-serif"><text x="34" y="40" font-size="13" fill="#d6ffe0" letter-spacing="2">HOW THE PIECES CONNECT</text><text x="1166" y="40" font-size="10" fill="#8294ae" text-anchor="end">ARCHITECTURE / SELECTED PROJECTS</text><text x="34" y="103" font-size="10" fill="#72ff9e" font-weight="700">VOLTA</text><rect x="210" y="75" width="210" height="48" rx="10" fill="#0c2515" /><text x="315" y="104" font-size="12" fill="#c4f7d3" text-anchor="middle">React dashboard</text><path d="M425 99h16l-5-4m5 4-5 4" stroke="#72ff9e" fill="none" class="flow" /><rect x="446" y="75" width="210" height="48" rx="10" fill="#0c2515" /><text x="551" y="104" font-size="12" fill="#c4f7d3" text-anchor="middle">Express API</text><path d="M661 99h16l-5-4m5 4-5 4" stroke="#72ff9e" fill="none" class="flow" /><rect x="682" y="75" width="210" height="48" rx="10" fill="#0c2515" /><text x="787" y="104" font-size="12" fill="#c4f7d3" text-anchor="middle">ACID transaction</text><path d="M897 99h16l-5-4m5 4-5 4" stroke="#72ff9e" fill="none" class="flow" /><rect x="918" y="75" width="210" height="48" rx="10" fill="#0c2515" /><text x="1023" y="104" font-size="12" fill="#c4f7d3" text-anchor="middle">Balanced ledger</text><text x="34" y="183" font-size="10" fill="#44d77a" font-weight="700">ADAPTIVE RAG</text><rect x="210" y="155" width="210" height="48" rx="10" fill="#0c2515" /><text x="315" y="184" font-size="12" fill="#c4f7d3" text-anchor="middle">User question</text><path d="M425 179h16l-5-4m5 4-5 4" stroke="#44d77a" fill="none" class="flow" /><rect x="446" y="155" width="210" height="48" rx="10" fill="#0c2515" /><text x="551" y="184" font-size="12" fill="#c4f7d3" text-anchor="middle">Query router</text><path d="M661 179h16l-5-4m5 4-5 4" stroke="#44d77a" fill="none" class="flow" /><rect x="682" y="155" width="210" height="48" rx="10" fill="#0c2515" /><text x="787" y="184" font-size="12" fill="#c4f7d3" text-anchor="middle">Retrieve / search</text><path d="M897 179h16l-5-4m5 4-5 4" stroke="#44d77a" fill="none" class="flow" /><rect x="918" y="155" width="210" height="48" rx="10" fill="#0c2515" /><text x="1023" y="184" font-size="12" fill="#c4f7d3" text-anchor="middle">Grounded response</text><text x="34" y="263" font-size="10" fill="#67d98b" font-weight="700">MRI MODEL</text><rect x="210" y="235" width="210" height="48" rx="10" fill="#0c2515" /><text x="315" y="264" font-size="12" fill="#c4f7d3" text-anchor="middle">MRI input</text><path d="M425 259h16l-5-4m5 4-5 4" stroke="#67d98b" fill="none" class="flow" /><rect x="446" y="235" width="210" height="48" rx="10" fill="#0c2515" /><text x="551" y="264" font-size="12" fill="#c4f7d3" text-anchor="middle">Preprocessing</text><path d="M661 259h16l-5-4m5 4-5 4" stroke="#67d98b" fill="none" class="flow" /><rect x="682" y="235" width="210" height="48" rx="10" fill="#0c2515" /><text x="787" y="264" font-size="12" fill="#c4f7d3" text-anchor="middle">ResNet50</text><path d="M897 259h16l-5-4m5 4-5 4" stroke="#67d98b" fill="none" class="flow" /><rect x="918" y="235" width="210" height="48" rx="10" fill="#0c2515" /><text x="1023" y="264" font-size="12" fill="#c4f7d3" text-anchor="middle">Class + Grad-CAM</text></g><circle cx="903" cy="99" r="4" fill="#72ff9e" class="pulse" style="animation-delay:-0s" /><circle cx="903" cy="179" r="4" fill="#44d77a" class="pulse" style="animation-delay:-1s" /><circle cx="903" cy="259" r="4" fill="#67d98b" class="pulse" style="animation-delay:-2s" /></svg>