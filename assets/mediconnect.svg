<svg xmlns="http://www.w3.org/2000/svg" width="560" height="310" viewBox="0 0 560 310" role="img" aria-labelledby="title"><title id="title">MEDICONNECT - Telemedicine platform - React + Express + MongoDB</title><style>
.flow{stroke-dasharray:7 9;animation:flow 2.5s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-in-out infinite}
.scan{animation:scan 4.5s ease-in-out infinite}
.transfer{animation:transfer 4s ease-in-out infinite}
.route{animation:route 5s linear infinite}
.ray-top{animation:ray-top 4s linear infinite}
.ray-bottom{animation:ray-bottom 4s linear infinite}
.ray-mid{animation:ray-mid 4s linear infinite}
.reveal{transform-box:fill-box;transform-origin:left;animation:reveal 5s ease-in-out infinite}
.cursor{animation:cursor 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-64}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(63px);opacity:.85}}
@keyframes transfer{0%,15%{transform:translateX(0);opacity:0}25%{opacity:1}70%{transform:translateX(179px);opacity:1}85%,100%{transform:translateX(179px);opacity:0}}
@keyframes route{0%{transform:translate(55px,102px);opacity:0}5%{opacity:1}32%{transform:translate(185px,76px)}64%{transform:translate(325px,102px)}92%{opacity:1}100%{transform:translate(492px,102px);opacity:0}}
@keyframes ray-top{0%{transform:translate(30px,70px);opacity:0}8%{opacity:1}56%{transform:translate(300px,70px)}95%{opacity:1}100%{transform:translate(510px,127px);opacity:0}}
@keyframes ray-bottom{0%{transform:translate(30px,128px);opacity:0}8%{opacity:1}56%{transform:translate(300px,128px)}95%{opacity:1}100%{transform:translate(510px,71px);opacity:0}}
@keyframes ray-mid{0%{transform:translate(30px,99px);opacity:0}8%,95%{opacity:1}100%{transform:translate(510px,99px);opacity:0}}
@keyframes reveal{0%,100%{transform:scaleX(.55);opacity:.4}50%{transform:scaleX(1);opacity:.85}}
@keyframes cursor{0%,15%,100%{transform:translate(0,0)}50%,75%{transform:translate(280px,12px)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.scan,.transfer,.route,.ray-top,.ray-bottom,.ray-mid,.reveal,.cursor{animation:none!important}.route,.ray-top,.ray-bottom,.ray-mid,.transfer{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035" /></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111822" /><stop offset="1" stop-color="#090e15" /></linearGradient></defs><rect width="560" height="310" rx="20" fill="url(#bg)" /><rect width="560" height="310" rx="20" fill="url(#grid)" /><rect x="1" y="1" width="558" height="308" rx="19" fill="none" stroke="#293444" /><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="10" fill="#72d8ed" letter-spacing="2">SELECTED WORK / 03</text><text x="28" y="180" font-size="29" fill="#f1f5fa" font-weight="700" letter-spacing="-1">MEDICONNECT</text><text x="28" y="207" font-size="15" fill="#a6b5c9">Telemedicine platform</text><text x="28" y="239" font-size="9" fill="#72d8ed" letter-spacing="1">PATIENT / DOCTOR / ADMIN</text><path d="M28 260h504" stroke="#293444" /><text x="28" y="287" font-size="12" fill="#a6b5c9">React + Express + MongoDB</text><text x="532" y="287" font-size="10" fill="#72d8ed" text-anchor="end">EXPLORE /</text><rect x="28" y="65" width="155" height="75" rx="10" fill="#1c293a" /><circle cx="53" cy="88" r="9" fill="#72d8ed" opacity=".6" class="pulse" style="animation-delay:-0s" /><text x="73" y="93" font-size="10" fill="#72d8ed">PATIENT</text><path d="M43 115h115M43 125h75" stroke="#586d85" /><rect x="203" y="65" width="155" height="75" rx="10" fill="#1c293a" /><circle cx="228" cy="88" r="9" fill="#72d8ed" opacity=".6" class="pulse" style="animation-delay:-1s" /><text x="248" y="93" font-size="10" fill="#72d8ed">DOCTOR</text><path d="M218 115h115M218 125h75" stroke="#586d85" /><rect x="378" y="65" width="155" height="75" rx="10" fill="#1c293a" /><circle cx="403" cy="88" r="9" fill="#72d8ed" opacity=".6" class="pulse" style="animation-delay:-2s" /><text x="423" y="93" font-size="10" fill="#72d8ed">ADMIN</text><path d="M393 115h115M393 125h75" stroke="#586d85" /></g><path d="M30 148h85l8-6 8 10 9-10 8 6h100l8-6 8 10 9-10 8 6h150" fill="none" stroke="#72d8ed" stroke-width="1.3" class="flow" /></svg>