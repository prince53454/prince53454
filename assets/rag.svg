cy="102" r="4" fill="#44d77a" /><text x="35" y="63" font-size="8" fill="#8aaf96">QUERY</text><text x="295" y="64" font-size="8" fill="#8aaf96">RETRIEVE</text><text x="465" y="64" font-size="8" fill="#8aaf96">ANSWER</text></g><circle r="4" fill="#eee6ff" class="route" style="animation-delay:0s" /><circle r="4" fill="#eee6ff" class="route" style="animation-delay:-2.5s" /></svg>